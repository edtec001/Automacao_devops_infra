---
- name: Configurar servidor de banco de dados MariaDB
  hosts: db01
  become: yes

  vars:
    mysql_root_password: devopsmaonamassa

    mysql_databases:
      - name: notes
        encoding: latin1
        collation: latin1_general_ci

    mysql_users:
      - name: notesapp
        host: "%"
        password: devopsmaonamassa
        priv: "notes.*:ALL"
        state: present

  roles:
    - configuracao-default-so

  tasks:
    # ---------------------------------------------------
    # /etc/hosts
    # ---------------------------------------------------
    - name: Configurar hosts do lab Ansible
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "{{ item }}"
        state: present
      loop:
        - "192.168.56.15 control-node"
        - "192.168.56.12 app01"
        - "192.168.56.13 db01"

    # ---------------------------------------------------
    # MARIA DB
    # ---------------------------------------------------
    - name: Instalar MariaDB Server e dependências
      ansible.builtin.dnf:
        name:
          - mariadb-server
          - mariadb
          - python3-PyMySQL
        state: present

    - name: Habilitar e iniciar MariaDB
      ansible.builtin.systemd:
        name: mariadb
        enabled: yes
        state: started

    # ---------------------------------------------------
    # ROOT PASSWORD
    # ---------------------------------------------------
    - name: Definir senha do root MariaDB
      community.mysql.mysql_user:
        name: root
        host: localhost
        password: "{{ mysql_root_password }}"
        state: present
        check_implicit_admin: yes
        login_unix_socket: /var/lib/mysql/mysql.sock

    # ---------------------------------------------------
    # DATABASE
    # ---------------------------------------------------
    - name: Criar banco de dados
      community.mysql.mysql_db:
        name: "{{ item.name }}"
        encoding: "{{ item.encoding }}"
        collation: "{{ item.collation }}"
        state: present
        login_user: root
        login_password: "{{ mysql_root_password }}"
      loop: "{{ mysql_databases }}"

    # ---------------------------------------------------
    # USERS
    # ---------------------------------------------------
    - name: Criar usuários do banco
      community.mysql.mysql_user:
        name: "{{ item.name }}"
        host: "{{ item.host }}"
        password: "{{ item.password }}"
        priv: "{{ item.priv }}"
        state: present
        login_user: root
        login_password: "{{ mysql_root_password }}"
      loop: "{{ mysql_users }}"
